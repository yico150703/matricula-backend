services:
  - type: web
    name: matricula-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_database_completa.py && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: matricula-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: PASSING_GRADE
        value: "11"
      - key: MAX_CREDITS
        value: "26"
      - key: SOBRECUPO_REPITENTES
        value: "5"
      - key: CARRITO_MINUTOS
        value: "10"
      - key: SESSION_HOURS
        value: "2"
      - key: STAFF_EMAIL_DOMAIN
        value: unfv.pe
      - key: DIAS_AJUSTE_HORARIO
        value: "14"
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: matricula-postgres
    plan: free
    databaseName: matricula
    user: matricula
