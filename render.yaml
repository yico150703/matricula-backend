services:
  - type: web
    name: matricula-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi:app db upgrade && python scripts/seed_curricula.py && python scripts/seed_periodo_secciones.py
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: matricula-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PASSING_GRADE
        value: "11"
databases:
  - name: matricula-postgres
    plan: free
    databaseName: matricula
    user: matricula
