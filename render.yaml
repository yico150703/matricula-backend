services:
  - type: web
    name: matricula-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/seed_database_completa.py && gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: matricula-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: PASSING_GRADE
        value: "11"
databases:
  - name: matricula-postgres
    plan: free
    databaseName: matricula
    user: matricula
